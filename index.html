<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="kanban-container">

        <!-- Header -->
        <div class="header">

            <h1>Kanban Task Game</h1>

            <!-- Buttons -->
            <div class="button-group">
                <button id="addTaskBtn">Add Task</button>
                <button id="searchTaskBtn">Filter</button>
                <button id="themeBtn">🌙 Dark Mode</button>
            </div>

        </div>

        <!-- Board -->
        <div class="board">

            <!-- TO DO Column -->
            <div class="column" data-column="TO DO">

                <div class="column-header todo">
                    <span>TO DO</span>
                    <span class="count" id="todoCount">0</span>
                </div>

                <div class="task-list"></div>

            </div>

            <!-- IN Progress Column -->
            <div class="column" data-column="IN Progress">

                <div class="column-header progress">
                    <span>IN Progress</span>
                    <span class="count" id="progressCount">0</span>
                </div>

                <div class="task-list"></div>

            </div>

            <!-- Review Column -->
            <div class="column" data-column="Review">

                <div class="column-header review">
                    <span>Review</span>
                    <span class="count" id="reviewCount">0</span>
                </div>

                <div class="task-list"></div>

            </div>

            <!-- Done Column -->
            <div class="column" data-column="Done">

                <div class="column-header done">
                    <span>Done</span>
                    <span class="count" id="doneCount">0</span>
                </div>

                <div class="task-list"></div>

            </div>

        </div>

    </div>

    <!-- JavaScript Files -->

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/addTask.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
    <script src="js/task.js"></script>
    <script src="js/dragdrop.js"></script>

</body>
</html>
